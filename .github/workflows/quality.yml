name: Database product contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm test --prefix tests
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check functions/process-product-notifications/index.ts functions/shared-vehicle-attachment/index.ts
