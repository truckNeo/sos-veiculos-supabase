name: Database product contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --prefix tests
      - run: npm test --prefix tests
      - run: node --test tests/asaas-functions.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check functions/process-product-notifications/index.ts functions/shared-vehicle-attachment/index.ts functions/create-asaas-pix/index.ts functions/decide-asaas-dispute/index.ts functions/release-asaas-payment/index.ts functions/asaas-webhook/index.ts functions/asaas-operation-webhook/index.ts functions/asaas-provider-onboarding/index.ts functions/confirm-asaas-sandbox-payment/index.ts functions/request-asaas-withdrawal/index.ts
